# apps.conf — lista de aplicativos desktop que o inventario_universal.sh verifica.
# Edite este arquivo livremente para adicionar/remover apps, sem precisar tocar no script.
#
# Formato (um app por linha, campos separados por "|"):
#   Nome exibido|termo de busca (pacote/flatpak/snap/.desktop)|comando1,comando2,...
#
# Linhas em branco ou começando com # são ignoradas.

Obsidian|obsidian|obsidian
VS Code|code|code,code-insiders
Antigravity|antigravity|antigravity
Wine|wine|wine,wine64
Google Chrome|chrome|google-chrome,google-chrome-stable
Firefox|firefox|firefox
Brave|brave|brave-browser
Microsoft Edge|edge|microsoft-edge,microsoft-edge-stable
LibreOffice|libreoffice|libreoffice
OnlyOffice|onlyoffice|onlyoffice-desktopeditors
