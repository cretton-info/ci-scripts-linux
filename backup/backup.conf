# Configuração do backup_multiperfil.sh, lida a cada execução (VAR=valor, uma por linha).
# O install.sh copia este arquivo para ~/scripts/ só na primeira instalação; depois disso,
# edite ~/scripts/backup.conf. Uma variável definida no ambiente tem prioridade sobre esta.
# Detalhes de cada variável: docs/SCRIPTS.md, seção backup/backup_multiperfil.sh.

# Dias de retenção dos backups locais de cada perfil (inteiro >= 1).
#RETENCAO_DIAS=7

# Padrões extras a excluir, separados por vírgula (somados a .git, node_modules, __pycache__, .cache).
#EXCLUDE_PATTERNS="*.log,tmp/*"

# Destinos de cópia após o backup local, separados por vírgula: remotes do rclone e/ou pastas
# locais (um HD externo, por exemplo; precisa existir, senão o envio é pulado).
#RCLONE_REMOTO="gdrive:backups/esta-maquina,/media/usuario/HD-BACKUP/backups"

# Flags extras do rclone copy.
#RCLONE_FLAGS="--transfers 4"

# Alerta (JSON via POST) quando o backup falha.
#WEBHOOK_URL=""
