# Configuração do backup_multiperfil.sh, lida a cada execução (VAR=valor, uma por linha).
# O install.sh copia este arquivo para ~/scripts/ só na primeira instalação; depois disso,
# edite ~/scripts/backup.conf — uma reinstalação nunca sobrescreve o que já existe lá.
# Uma variável definida no ambiente (ex.: "sudo -E VAR=... backup_multiperfil.sh") tem
# prioridade sobre esta. Pra usar outro arquivo em vez deste: BACKUP_CONF=/caminho/outro.conf.
# Detalhes de cada variável: docs/SCRIPTS.md, seção backup/backup_multiperfil.sh.
#
# Só vale pro backup_multiperfil.sh. O restaurar_backup.sh (RETENCAO_PREVENTIVOS_DIAS) e o
# simulado_restauracao.sh não leem este arquivo — só variável de ambiente, se precisar mudar
# o padrão deles.
#
# Segurança: o arquivo é lido sem ser executado (nunca faz "source"), então não dá pra injetar
# comando mesmo que alguém consiga editá-lo — mas quem tiver permissão de escrita aqui controla
# pra onde os backups são enviados (RCLONE_REMOTO) e por quanto tempo ficam retidos
# (RETENCAO_DIAS). Mantenha a permissão padrão (dono = seu usuário, sem escrita para outros).

# Dias de retenção dos backups locais de cada perfil (inteiro >= 1). Valor inválido faz o
# script recusar a execução, em vez de arriscar apagar o backup recém-criado na primeira rotação.
#RETENCAO_DIAS=7

# Padrões extras a excluir, separados por vírgula (somados a .git, node_modules, __pycache__, .cache).
#EXCLUDE_PATTERNS="*.log,tmp/*"

# Destinos de cópia após o backup local, separados por vírgula: remotes do rclone (requer
# "rclone config" já feito — ver docs/BACKUP_REMOTO.md pro passo a passo com Google Drive) e/ou
# pastas locais (ex.: um HD externo). Cada destino é enviado de forma independente: falha num
# (rede fora do ar, HD desmontado) não impede o envio pros outros. Destino local que não existir
# na hora é pulado com aviso, nunca grava no disco do sistema no lugar dele.
#RCLONE_REMOTO="gdrive:backups/esta-maquina,/media/usuario/HD-BACKUP/backups"

# Flags extras do rclone copy (aplicadas a todos os destinos de RCLONE_REMOTO).
#RCLONE_FLAGS="--transfers 4"

# Alerta (JSON via POST) quando o backup falha: sem nenhuma origem válida, tar falhou, backup
# saiu corrompido, ou falha ao enviar pra algum destino de RCLONE_REMOTO. Mesma variável usada
# por outros scripts do repositório (health_check.sh, restaurar_backup.sh) — não é exclusiva
# deste arquivo, então mudar aqui não afeta os outros (cada um lê do seu próprio ambiente/conf).
#WEBHOOK_URL=""

# Intervalo mínimo entre alertas repetidos do mesmo motivo, em horas (evita inundar o webhook
# se o mesmo problema persistir em várias execuções seguidas). Só tem efeito com WEBHOOK_URL
# definida.
#ALERTA_COOLDOWN_HORAS=6
