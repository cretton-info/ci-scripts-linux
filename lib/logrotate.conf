# Rotação dos logs automáticos gravados por lib/common.sh (log_warn/log_error/die).
# Instalado automaticamente pelo install.sh em /etc/logrotate.d/ci-scripts-linux
# quando rodado como root. O logrotate do sistema já roda diariamente sozinho —
# nada mais precisa ser configurado.
/var/log/ci-scripts-linux/*.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
}
